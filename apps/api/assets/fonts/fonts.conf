<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- System fonts first, then Share preview vendored faces (Mulish, Noto). -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="cwd">.</dir>
  <alias>
    <family>Mulish</family>
    <prefer><family>Mulish</family></prefer>
  </alias>
</fontconfig>
