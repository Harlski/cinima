# Cinima API on Linode (or any VPS). Run from repo root:
#   docker compose -f deploy/compose.api.yml up -d --build
#
# Host reverse proxy can keep sending api.cinima.app to 127.0.0.1:8787.
# The API container forwards GET /api/studio to the Studio container.
name: cinima-api

services:
  api:
    image: cinima-api:local
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: cinima-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      STUDIO_INLINE: "0"
      SENDER_INLINE: "0"
      STUDIO_UPSTREAM: http://studio:8788
      NIM_SENDER_PRIVATE_KEY: ""
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - cinima-api-data:/app/apps/api/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  studio:
    image: cinima-api:local
    command: ["node", "dist/studio-index.js"]
    container_name: cinima-studio
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: "8788"
      STUDIO_INLINE: "0"
      SENDER_INLINE: "0"
      NIM_SENDER_PRIVATE_KEY: ""
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - cinima-api-data:/app/apps/api/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8788/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  sender:
    image: cinima-api:local
    command: ["node", "dist/sender-index.js"]
    container_name: cinima-sender
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: "8789"
      SENDER_INLINE: "1"
    ports:
      - "127.0.0.1:8789:8789"
    volumes:
      - cinima-api-data:/app/apps/api/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8789/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  cinima-api-data:
