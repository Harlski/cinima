# Cinima API on Linode (or any VPS). Run from repo root:
#   docker compose -f deploy/compose.api.yml up -d --build
#
# Host reverse proxy for api.cinima.app should split:
#   /api/studio*  -> 127.0.0.1:8788
#   everything else -> 127.0.0.1:8787
# See deploy/Caddyfile.api.example.
name: cinima-api

services:
  api:
    image: cinima-api:local
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: cinima-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      STUDIO_INLINE: "0"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - cinima-api-data:/app/apps/api/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  studio:
    image: cinima-api:local
    command: ["node", "dist/studio-index.js"]
    container_name: cinima-studio
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: "8788"
      STUDIO_INLINE: "0"
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - cinima-api-data:/app/apps/api/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8788/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  cinima-api-data:
