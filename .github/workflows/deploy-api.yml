name: Deploy API to Linode

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "deploy/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api-linode
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      LINODE_HOST: ${{ secrets.LINODE_HOST }}
      LINODE_USER: ${{ secrets.LINODE_USER }}
      LINODE_DEPLOY_PATH: ${{ secrets.LINODE_DEPLOY_PATH }}
      LINODE_SSH_KEY: ${{ secrets.LINODE_SSH_KEY }}
    steps:
      - name: Verify deploy secrets
        run: |
          set -eu
          missing=0
          if [ -z "$LINODE_HOST" ]; then
            echo "::error::LINODE_HOST secret is missing"
            missing=1
          fi
          if [ -z "$LINODE_USER" ]; then
            echo "::error::LINODE_USER secret is missing (set to: cinima)"
            missing=1
          fi
          if [ -z "$LINODE_SSH_KEY" ]; then
            echo "::error::LINODE_SSH_KEY secret is missing"
            missing=1
          fi
          if [ -z "$LINODE_DEPLOY_PATH" ]; then
            echo "LINODE_DEPLOY_PATH not set; using /opt/cinima"
            LINODE_DEPLOY_PATH=/opt/cinima
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Deploy target: ${LINODE_USER}@${LINODE_HOST}:${LINODE_DEPLOY_PATH:-/opt/cinima}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH key
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$LINODE_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null
          echo "Deploy key fingerprint (must match server authorized_keys):"
          ssh-keygen -lf ~/.ssh/id_deploy
          ssh-keyscan -H "$LINODE_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          set -eu
          APP_DIR="${LINODE_DEPLOY_PATH:-/opt/cinima}"
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o IdentitiesOnly=yes \
            "${LINODE_USER}@${LINODE_HOST}" \
            "mkdir -p '${APP_DIR}' && echo ssh_ok"

      - name: Sync source to Linode
        run: |
          set -eu
          APP_DIR="${LINODE_DEPLOY_PATH:-/opt/cinima}"
          rsync -avzr --delete \
            --exclude .git \
            --exclude node_modules \
            --exclude apps/web \
            --exclude .env \
            --exclude apps/api/data \
            --exclude '**/dist' \
            -e "ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o IdentitiesOnly=yes" \
            ./ "${LINODE_USER}@${LINODE_HOST}:${APP_DIR}/"

      - name: Build and restart API
        run: |
          set -eu
          APP_DIR="${LINODE_DEPLOY_PATH:-/opt/cinima}"
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o IdentitiesOnly=yes \
            "${LINODE_USER}@${LINODE_HOST}" \
            "cd '${APP_DIR}' && docker compose -f deploy/compose.api.yml up -d --build --remove-orphans && docker image prune -f"
